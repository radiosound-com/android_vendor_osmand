## Packaging and signing

The OsmAnd APK is signed with the dedicated Caramel OsmAnd release identity and
the AOSP product build preserves that signature. The templates-host APK remains
an unsigned/debug build artifact in this repository; the AOSP product build
signs that privileged component with the Caramel Vanilla platform certificate.
The platform-signed templates-host APK used for the live Pi renderer test had
SHA-256 `fe5955e267499e076d301da26724d16777a27466b740b333a96a033354da65df`.
