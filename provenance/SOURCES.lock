## Packaging and signing

These APKs are unsigned/debug build artifacts in this repository and are
stored with Git LFS. The AOSP product build signs them with the Caramel
Vanilla platform certificate. The platform-signed APK used for the live Pi
renderer test was generated from the templates-host artifact above and had
SHA-256 `fe5955e267499e076d301da26724d16777a27466b740b333a96a033354da65df`.
